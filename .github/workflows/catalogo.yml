# Al subir el tag de una versión de un addon (`<id>-vX.Y.Z`), regenera catalogo.json en main y
# publica el .nookaddon de esa versión en la release del tag.
name: catalogo

on:
  push:
    tags: ["*-v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  catalogo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - run: python3 herramientas/catalogo.py
      - name: Subir el catálogo si cambió
        run: |
          if git diff --quiet catalogo.json; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalogo.json
          git commit -m "chore: actualizar el catálogo"
          git push origin main
      # El archivo .nookaddon de esa versión, para añadirlo a mano en Nookly (en Nookly Pro, la
      # única forma), en la release del tag.
      - name: Publicar el .nookaddon en la release del tag
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          archivo=$(python3 herramientas/nookaddon.py "$TAG")
          gh release create "$TAG" "$archivo" --title "$TAG" \
            --notes "Descarga el archivo .nookaddon y añádelo en Nookly: Configuración → Addons → Añadir addon…, o arrástralo a la barra."
