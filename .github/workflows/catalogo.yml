# Al subir el tag de una versión de un addon (`<id>-vX.Y.Z`), regenera catalogo.json en main.
name: catalogo

on:
  push:
    tags: ["*-v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  catalogo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - run: python3 herramientas/catalogo.py
      - name: Subir el catálogo si cambió
        run: |
          if git diff --quiet catalogo.json; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalogo.json
          git commit -m "chore: actualizar el catálogo"
          git push origin main
